<table>
  <tr>
    <td>
      <label for="firstNumber">First Number:</label>
    </td>
    <td>
      <input name="firstNumber" id="firstNumber" value="{{firstNumber | number: '1.0-2'}}" #firstInput>
    </td>
  </tr>
  <tr>
    <td>
      <label for="secondNumber">Second Number:</label>
    </td>
    <td>
      <input name="secondNumber" id="secondNumber" value="{{secondNumber | number: '1.0-2'}}" #secondInput>
    </td>
  </tr>
  <tr>
    <td>
      <label for="result">Result:</label>
    </td>
    <td>
      <input name="result" id="result" value="{{result | number: '1.0-2'}}" #resultNumber>
    </td>
  </tr>
</table>
 <tr>
    <td colspan = "2">
        <div class = "operations">
        <button (click)="addOperation(firstInput.value, secondInput.value)">+</button>
        <button (click)="subtractOperation(firstInput.value, secondInput.value)">-</button>
        <button (click)="multiplyOperation(firstInput.value, secondInput.value)">×</button>
        <button (click)="divideOperation(firstInput.value, secondInput.value)">÷</button>
        </div>
    </td>
  </tr>
