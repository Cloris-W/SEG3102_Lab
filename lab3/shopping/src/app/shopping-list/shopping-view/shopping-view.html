<form class="ui large form segment">
  <h3 class="ui header">Product Details</h3>
  <div class="form-group">
    <label for="productName">Product Name</label>
    <input class="form-control" name="productName" id="productName" [(ngModel)]="productName" required>
  </div>
  <div class="btn-toolbar" role="toolbar">
    <button class="btn btn-danger" name="delete" type="button" (click)="delete()">Delete</button>
    <button class="btn btn-secondary m-auto" type="button" (click)="update()">Update</button>
  </div>
</form>
