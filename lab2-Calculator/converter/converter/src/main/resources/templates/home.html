<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temperature Converter</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <h1>Calculator</h1>
    <div th:switch="${error}">
        <p th:case="'FirstNumberFormatError'">
            Wrong value provided for First Number - must be a number
        </p>
        <p th:case="'SecondNumberFormatError'">
            Wrong value provided for Second Number - must be a number
        </p>
        <p th:case="'OperationFormatError'">
            Wrong operation
        </p>
    </div>
    <form th:action="@{/convert}" method="get">
        <table>
            <tr>
                <td><label for="firstNumber">First Number:</label></td>
                <td><input name="firstNumber"
                           id="firstNumber"
                           th:name="firstNumber" th:value="${firstNumber}"></td>
            </tr>
            <tr>
                <td><label for="secondNumber">Second Number:</label></td>
                <td><input name="secondNumber"
                           id="secondNumber"
                           th:name="secondNumber" th:value="${secondNumber}"></td>
            </tr>
            <tr>
                <td><label for="result">Result:</label></td>
                <td><input name="result"
                           id="result"
                           th:name="result" th:value="${result}" readonly></td>
            </tr>
        </table>
        <div class="operations">
            <button type="submit" th:name="operation" th:value="firstValAddSecondVal">
                +
            </button>
            <button type="submit" th:name="operation" th:value="firstValSubtractSecondVal">
                -
            </button>
            <button type="submit" th:name="operation" th:value="firstValMultiplySecondVal">
                ×
            </button>
            <button type="submit" th:name="operation" th:value="firstValDivideSecondVal">
                ÷
            </button>
        </div>
    </form>
</body>
</html>
