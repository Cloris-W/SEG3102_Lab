<h3>Address List</h3>
@if (addresses$ | async; as addresses) {
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Phone Number</th>
        <th>Email</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      @for (address of addresses; track address.id) {
        <tr>
          <td>{{ address.firstName }}</td>
          <td>{{ address.lastName }}</td>
          <td>{{ address.phone }}</td>
          <td>{{ address.email }}</td>
          <td>{{ address.notes }}</td>
        </tr>
      } @empty {
        <tr><td colspan="5">No saved addresses yet.</td></tr>
      }
    </tbody>
  </table>
}
<button type="button" class="btn btn-secondary" routerLink="/address-list">Back to Address Book</button>
